<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<meta name="theme-color" content="#000000">
		<title>Glyphica</title>
		<link rel="icon" href="dist/icon.png" type="image/png">
		<link rel="stylesheet" href="styles.css">
		<script type="importmap">
		{
			"imports": {
				"sphere-runtime": "./assets/game_modules/sphere-runtime.js",
				"console": "./assets/game_modules/console.js",
				"focus-target": "./assets/game_modules/focus-target.js",
				"music": "./assets/game_modules/music.js",
				"node": "./assets/game_modules/node.js",
				"pact": "./assets/game_modules/pact.js",
				"prim": "./assets/game_modules/prim.js",
				"scene": "./assets/game_modules/scene.js",
				"task": "./assets/game_modules/task.js",
				"tween": "./assets/game_modules/tween.js",
				"data-stream": "./assets/runtime/data-stream.js",
				"from": "./assets/runtime/from.js",
				"logger": "./assets/runtime/logger.js",
				"random": "./assets/runtime/random.js",
				"decomp": "./assets/external_libs/decomp.js",
				"matter": "./assets/external_libs/matter.js",
				"yoga": "./assets/external_libs/yoga.js"
			}
		}
		</script>
	</head>
	<body>
		<main id="screen-container">
			<canvas id="screen" width="1024" height="576" tabindex="0" aria-label="Glyphica"></canvas>
		</main>
		<section id="loading-screen" aria-live="polite" aria-atomic="true">
			<div class="loading-panel">
				<h1 id="loading-title">Loading</h1>
				<p id="loading-stage">Preparing game files…</p>
				<progress id="loading-progress" max="100" value="0" aria-label="Game loading progress"></progress>
				<p id="loading-summary">Waiting for the offline cache…</p>
				<p id="loading-file" class="loading-file"></p>
				<p id="loading-file-size" class="loading-meta"></p>
				<div id="loading-error" role="alert" hidden>
				<p id="loading-error-message" class="visually-hidden"></p>
					<button id="loading-retry" type="button">Retry</button>
				</div>
			</div>
		</section>
		<script>
			(async () => {
				globalThis.global = globalThis;
				const screen = document.getElementById('loading-screen');
				const title = document.getElementById('loading-title');
				const stage = document.getElementById('loading-stage');
				const progress = document.getElementById('loading-progress');
				const summary = document.getElementById('loading-summary');
				const currentFile = document.getElementById('loading-file');
				const currentSize = document.getElementById('loading-file-size');
				const errorBox = document.getElementById('loading-error');
				const errorMessage = document.getElementById('loading-error-message');
				const retryButton = document.getElementById('loading-retry');
				let lastGameProgressAt = 0;
				let lastGameProgress = null;
				const formatBytes = bytes => {
					if (!Number.isFinite(bytes) || bytes < 0) return '—';
					if (bytes < 1024) return `${bytes} B`;
					const units = ['KiB', 'MiB', 'GiB'];
					let value = bytes / 1024;
					for (let i = 0; i < units.length - 1 && value >= 1024; ++i) value /= 1024;
					const unit = units[Math.min(units.length - 1, Math.floor(Math.log2(bytes / 1024) / 10))];
					return `${value.toFixed(1)} ${unit}`;
				};
				const showError = (message, detail = '', heading = 'Unable to start') => {
					screen.hidden = false;
					title.textContent = heading;
					stage.textContent = message;
					summary.textContent = detail;
					errorMessage.textContent = detail ? `${message} ${detail}` : message;
					currentFile.textContent = '';
					currentSize.textContent = '';
					progress.hidden = true;
					errorBox.hidden = false;
					retryButton.focus({ preventScroll: true });
				};
				const updateProgress = data => {
					if (data.stage === 'prepare') {
						stage.textContent = 'Preparing offline game files…';
						progress.removeAttribute('value');
						summary.textContent = 'Reading the game asset list…';
						currentFile.textContent = '';
						currentSize.textContent = '';
						return;
					}
					if (data.stage === 'assets') {
						stage.textContent = data.source === 'cache'
							? 'Preparing files from the existing offline cache…'
							: 'Downloading game files for offline play…';
						const percent = data.totalBytes > 0
							? Math.min(100, 100 * data.loadedBytes / data.totalBytes)
							: Math.min(100, 100 * data.completedFiles / Math.max(1, data.totalFiles));
						progress.value = percent;
						progress.setAttribute('aria-valuenow', String(Math.round(percent)));
						summary.textContent = `${data.completedFiles} / ${data.totalFiles} files · ${formatBytes(data.loadedBytes)} / ${formatBytes(data.totalBytes)}`;
						currentFile.textContent = data.currentFile ? `${data.source === 'cache' ? 'Using cached file' : 'Downloading'}: ${data.currentFile}` : 'Preparing file list…';
						currentSize.textContent = data.currentFile
							? `${formatBytes(data.currentBytes)} / ${formatBytes(data.currentTotalBytes)}`
							: '';
						return;
					}
					if (data.stage === 'game') {
						stage.textContent = 'Loading game data…';
						if (data.totalBytes > 0) {
							const percent = Math.min(100, 100 * data.loadedBytes / data.totalBytes);
							progress.value = percent;
							progress.setAttribute('aria-valuenow', String(Math.round(percent)));
							summary.textContent = `${data.fileCount} files · ${formatBytes(data.loadedBytes)} / ${formatBytes(data.totalBytes)}`;
						}
						else {
							progress.removeAttribute('value');
							summary.textContent = `Loading ${data.fileCount} files · ${formatBytes(data.loadedBytes)} received`;
						}
						currentFile.textContent = data.currentFile ? `Loading: ${data.currentFile}` : 'Preparing game…';
						currentSize.textContent = data.currentFile
							? `${formatBytes(data.currentBytes)} / ${formatBytes(data.currentTotalBytes)}`
							: '';
						return;
					}
					if (data.stage === 'complete') {
						stage.textContent = 'Starting Glyphica…';
						progress.value = 100;
						progress.setAttribute('aria-valuenow', '100');
						summary.textContent = `${formatBytes(data.totalBytes)} stored for offline play`;
						currentFile.textContent = 'Starting game…';
						currentSize.textContent = '';
					}
				};
				retryButton.addEventListener('click', () => location.reload());
				navigator.serviceWorker?.addEventListener('message', event => {
					const data = event.data;
					if (data?.type !== 'glyphica-load-progress') return;
					if (data.stage === 'error') showError('The offline game files could not be prepared.', data.message || 'Check the connection and available storage, then retry.');
					else updateProgress(data);
				});
				window.addEventListener('glyphica-game-progress', event => {
					lastGameProgressAt = Date.now();
					lastGameProgress = event.detail;
					updateProgress({ stage: 'game', ...event.detail });
				});
				setInterval(() => {
					if (screen.hidden || !lastGameProgressAt || Date.now() - lastGameProgressAt < 15000)
						return;
					if (lastGameProgress?.fileComplete) {
						stage.textContent = 'Preparing downloaded game data…';
						summary.textContent = `${lastGameProgress.fileCount} files · ${formatBytes(lastGameProgress.loadedBytes)} received; waiting for game initialization…`;
						currentFile.textContent = lastGameProgress.currentFile
							? `Last completed: ${lastGameProgress.currentFile}`
							: 'Waiting for game initialization…';
						currentSize.textContent = lastGameProgress.currentFile
							? `${formatBytes(lastGameProgress.currentBytes)} / ${formatBytes(lastGameProgress.currentTotalBytes)} · complete`
							: '';
					}
					else
						stage.textContent = 'Waiting for more data from the current file…';
				}, 1000);
				window.addEventListener('glyphica-game-ready', () => { screen.hidden = true; });
				window.addEventListener('glyphica-game-error', event => {
					const wasRunning = screen.hidden;
					showError(
						wasRunning ? 'The game encountered an error.' : 'The game could not finish loading.',
						event.detail?.message || 'Reload the page to try again.',
						wasRunning ? 'Game error' : 'Unable to start',
					);
				});

				if (location.protocol === 'file:') {
					showError('This browser cannot launch the game from a file path.', 'Run “python -m http.server 8000” from the outputs folder and open http://localhost:8000, or deploy it to GitHub Pages or Cloudflare Pages.');
					return;
				}

				let serviceWorkerRegistration = null;
				const alreadyControlled = Boolean(navigator.serviceWorker?.controller);
				if ('serviceWorker' in navigator) {
					try {
						const controlled = alreadyControlled
							? Promise.resolve()
							: new Promise(resolve => navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true }));
						serviceWorkerRegistration = await navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' });
						await navigator.serviceWorker.ready;
						await controlled;
					}
					catch (error) {
						if (!alreadyControlled) {
							showError('Offline storage is unavailable in this browser.', error?.message || 'Use a browser with service worker and cache support.');
							console.error(error);
							return;
						}
						console.warn('Using the existing offline game cache.', error);
					}
				}
				else {
					stage.textContent = 'Loading game data…';
					summary.textContent = 'Offline caching is not available in this browser.';
					progress.removeAttribute('value');
				}

				await new Promise((resolve, reject) => {
					const script = document.createElement('script');
					script.src = './dist/directory-index.js';
					script.onload = resolve;
					script.onerror = () => reject(new Error('Could not load game data.'));
					document.head.appendChild(script);
				});
				if (alreadyControlled && !serviceWorkerRegistration?.installing) {
					const totalBytes = Object.values(globalThis.GLYPHICA_FILE_SIZES ?? {}).reduce((total, size) => total + size, 0);
					updateProgress({ stage: 'complete', totalBytes });
				}
				await import('./scripts/main.js');
			})().catch(error => {
				console.error(error);
				globalThis.dispatchEvent(new CustomEvent('glyphica-game-error', {
					detail: { message: error?.message || 'Reload the page to try again.' },
				}));
			});
		</script>
	</body>
</html>
